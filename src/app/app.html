<main class="app-shell">
  <app-instructions
    [hasCapturedImage]="hasCapturedImage()"
    (isCaptureStarted)="onStartClicked()"
  />

  @if (isCaptureStarted() && !hasCapturedImage()) {
    <app-video-preview
      (snapshotCaptured)="onSnapshotCaptured($event)"
    />
  }

  <app-snapshot-result
    [capturedImage]="capturedImage()"
  />
</main>
